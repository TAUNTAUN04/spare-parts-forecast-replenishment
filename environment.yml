# 推荐方式：conda 干净环境（Windows 上装 Prophet 最稳）
# 创建：conda env create -f environment.yml
# 启用：conda activate supplychain
# 跑：  python 01_demand_forecast_and_replenishment.py
#       streamlit run 02_streamlit_app.py
name: supplychain
channels:
  - conda-forge
dependencies:
  - python=3.11           # Prophet 在 3.11 上踩坑概率最低；3.13 太新很多依赖刚适配
  - pandas>=2.0
  - numpy>=1.24
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - prophet>=1.1.5        # conda-forge 的 prophet 自带 cmdstanpy，比 pip 安装更省心
  - streamlit>=1.30
  - pyarrow>=14           # Streamlit 渲染 DataFrame 需要
  - pip
  - pip:
      - zhipuai>=2.1      # 智谱 AI GLM SDK，AI 助手 tab 用
